name: Test action fails at API call with invalid credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: 'fake-github-token'
          openai-api-key: 'fake-openai-key'
          ngrok-authtoken: 'fake-ngrok-token'
          lines-changed-threshold: '100'
          time-limit-minutes: '10'
          max-attempts: '3'
          model: 'o4-mini'

      - name: Assert action failed at API stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the GitHub token is invalid (not because inputs are missing)
          # This confirms the action passed input validation and attempted to call the GitHub API
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using invalid API credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using invalid API credentials (passed input validation)"
