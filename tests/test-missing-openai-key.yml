name: Test missing OpenAI API key validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          openai-api-key: ''
          ngrok-authtoken: 'fake-ngrok-token'
      - name: Assert action failed due to missing OpenAI API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when openai-api-key is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when openai-api-key was not provided"
