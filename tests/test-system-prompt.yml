name: Test system-prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          openai-api-key: fake-openai-key
          ngrok-authtoken: fake-ngrok-token
          model: o4-mini
          lines-changed-threshold: '100'
          time-limit-minutes: '1'
          max-attempts: '1'
          system-prompt: >-
            You are a quiz generator. Return multiple choice questions only.
      - name: Assert action ran with system-prompt input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because we are not in a PR context
          # and/or the API credentials are fake. What matters is that the
          # system-prompt input was accepted (no "unknown input" error) and
          # the action attempted to run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with system-prompt input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
