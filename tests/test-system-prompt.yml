name: Test system-prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          openai-api-key: fake-openai-key
          ngrok-authtoken: fake-ngrok-token
          system-prompt: >-
            You are a quiz generator. Generate multiple choice questions based
            on the pull request changes. Return the questions in JSON format.
          model: o4-mini
          lines-changed-threshold: '50'
          time-limit-minutes: '5'
          max-attempts: '2'
      - name: Assert action was invoked with system-prompt
        run: |
          echo "Action step completed (with or without error due to fake credentials)"
          echo "PASS: action was invoked with system-prompt input"
