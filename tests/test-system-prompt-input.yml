name: Test system-prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          openai-api-key: fake-openai-key
          ngrok-authtoken: fake-ngrok-token
          model: o4-mini
          lines-changed-threshold: '100'
          time-limit-minutes: '5'
          max-attempts: '3'
          system-prompt: >-
            You are a quiz generator. Generate multiple choice questions based on
            the pull request changes. Always return multiple choice questions.
      - name: Assert action ran and failed gracefully (no PR context or invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no PR context / invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
