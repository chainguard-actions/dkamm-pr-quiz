name: Test system-prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          openai-api-key: fake-openai-key
          ngrok-authtoken: fake-ngrok-token
          model: o4-mini
          lines-changed-threshold: '100'
          time-limit-minutes: '10'
          max-attempts: '3'
          system-prompt: >-
            You are a quiz generator. Return multiple choice questions based on
            the pull request changes.
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid API credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
