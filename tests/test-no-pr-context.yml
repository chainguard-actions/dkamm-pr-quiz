name: Test action fails without pull request context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          openai-api-key: 'fake-openai-key'
          ngrok-authtoken: 'fake-ngrok-token'
          model: 'o4-mini'
          lines-changed-threshold: '100'
          time-limit-minutes: '10'
          max-attempts: '3'
      - name: Assert action failed without pull request context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when run outside of a pull_request event, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull request context was available"
